[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "gaze9999"}]
license = {file = "LICENSE"}
name = "my-py-document-core"
version = "0.4.0"
description = "Reusable local document extraction API"
readme = "docs/python-document-core.md"
requires-python = ">=3.10"

[tool.setuptools]
include-package-data = false
packages = ["my_py_document_core", "my_py_document_core.documents", "my_py_document_core.shared"]

[tool.setuptools.package-dir]
my_py_document_core = "src/my_py_document_core"
"my_py_document_core.documents" = "src/documents"
"my_py_document_core.shared" = "src/shared"

[project.urls]
Repository = "https://github.com/gaze9999/codex-toolkit"
