name: Release standalone Python tools
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag with the reviewed source changes
        required: true

permissions:
  contents: read

defaults:
  run:
    working-directory: python-tools

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check stable aggregate Release eligibility
        if: github.event_name == 'release'
        shell: bash
        working-directory: .
        env:
          POLICY_TAG: ${{ github.event.release.tag_name }}
          POLICY_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['POLICY_TAG']
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('A complete stable version at or above 1.0.0 is required')
          if tag != 'v' + version or os.environ['POLICY_PRERELEASE'] == 'true':
              raise SystemExit('Release must match the stable aggregate VERSION')
          PY

  source:
    needs: eligibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r setup/requirements-release.txt
      - name: Prepare and verify source ZIP and independent core wheels
        run: python launch-cli.py scripts.release prepare
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: |
            python-tools/dist/${{ env.RELEASE_TAG }}/*.zip
            python-tools/dist/${{ env.RELEASE_TAG }}/*.whl
            python-tools/dist/${{ env.RELEASE_TAG }}/release-manifest.json
          if-no-files-found: error

  cli:
    needs: eligibility
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate CLI release tag
        working-directory: .
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([+-].+)?$') { throw 'A release tag is required' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r setup/requirements-cli-build.txt
      - name: Build independent CLI through release helper
        shell: pwsh
        run: |
          python launch-cli.py scripts.release cli "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'CLI release build failed' }
      - name: Verify native CLI without a source checkout or local Python
        shell: pwsh
        run: |
          $marker = Get-ChildItem dist/cli -Filter 'cli-manifest-*.json' -Recurse | Select-Object -First 1
          $metadata = Get-Content $marker.FullName -Raw | ConvertFrom-Json
          $executable = Join-Path $marker.DirectoryName $metadata.entrypoints.cli
          $executable = (Resolve-Path -LiteralPath $executable).Path
          $fixture = Join-Path $env:RUNNER_TEMP ('my-py-tools-cli-' + [guid]::NewGuid().ToString() + '.txt')
          $markdown = [IO.Path]::ChangeExtension($fixture, '.md')
          Push-Location $env:RUNNER_TEMP
          try {
            & $executable --list
            if ($LASTEXITCODE -ne 0) { throw 'CLI list failed' }
            $tokens = & $executable text.tokenizer --text hello --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $tokens.chars -ne 5 -or $tokens.method -ne 'tiktoken') { throw 'Offline CLI tokenizer failed' }
            Set-Content -LiteralPath $fixture -Value 'Portable CLI document verification' -Encoding utf8
            & $executable documents.convert_to_markdown $fixture
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $markdown)) { throw 'Native CLI extraction failed' }
            & $executable scripts.release prepare --dry-run
            if ($LASTEXITCODE -eq 0) { throw 'Frozen CLI must not execute source-only release tools' }
            $global:LASTEXITCODE = 0
          } finally {
            Pop-Location
            foreach ($path in @($fixture, $markdown)) { if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path } }
          }
      - name: Verify standalone terminal CLI and Windows launchers
        shell: pwsh
        run: |
          $marker = Get-ChildItem dist/cli -Filter 'cli-manifest-*.json' -Recurse | Select-Object -First 1
          $metadata = Get-Content $marker.FullName -Raw | ConvertFrom-Json
          $executable = Join-Path $marker.DirectoryName $metadata.entrypoints.cli
          python launch-cli.py distribution.smoke_cli $executable
          if ($LASTEXITCODE -ne 0) { throw 'Portable terminal CLI verification failed' }
          if ($IsWindows) {
            $terminal = Join-Path $marker.DirectoryName $metadata.entrypoints.cmd
            & $terminal --list
            if ($LASTEXITCODE -ne 0) { throw 'Terminal CMD entry point failed' }
            $terminalPs1 = Join-Path $marker.DirectoryName $metadata.entrypoints.ps1
            & $terminalPs1 --list
            if ($LASTEXITCODE -ne 0) { throw 'Terminal PS1 entry point failed' }
            $global:LASTEXITCODE = 0
          }
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact }}
          path: |
            python-tools/dist/cli/**/my-py-tools-*-cli-*.zip
            python-tools/dist/cli/**/cli-manifest-*.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [source, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check stable aggregate Release eligibility
        shell: bash
        working-directory: .
        env:
          POLICY_TAG: ${{ github.event.release.tag_name }}
          POLICY_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['POLICY_TAG']
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('A complete stable version at or above 1.0.0 is required')
          if tag != 'v' + version or os.environ['POLICY_PRERELEASE'] == 'true':
              raise SystemExit('Release must match the stable aggregate VERSION')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
      - name: Publish only cloud-built, verified source and portable assets
        working-directory: .
        shell: pwsh
        run: |
          $release = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft) { throw 'A published release is required' }
          $assets = @(Get-ChildItem release-assets -File -Recurse | Where-Object { $_.Name -like 'my-py-tools-*.zip' -or $_.Name -like 'my_py_*_core-*.whl' -or $_.Name -eq 'release-manifest.json' -or $_.Name -like 'cli-manifest-*.json' })
          if ($assets.Count -ne 10) { throw 'Expected source ZIP, two core wheels, release manifest, three CLI ZIPs and three platform manifests' }
          foreach ($asset in $assets) {
            if ($release.assets.name -contains $asset.Name) { throw "Existing release asset will not be overwritten: $($asset.Name)" }
          }
          gh release upload $env:RELEASE_TAG @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $published = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify published release' }
          foreach ($asset in $assets) {
            $remote = @($published.assets | Where-Object name -eq $asset.Name)
            $hash = 'sha256:' + (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remote.Count -ne 1 -or $remote[0].size -ne $asset.Length -or $remote[0].digest -ne $hash) { throw "Published asset mismatch: $($asset.Name)" }
          }
