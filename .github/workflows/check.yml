name: Check public toolkit sources
on:
  push:
    tags: ['v[0-9]+.0.0', 'v[1-9].[0-9]+.0', 'v[1-9][0-9]+.[0-9]+.0']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/jev-evaluation/requirements.txt
      - run: python -B -m unittest discover -s mcp/tests -p 'test_*.py'
      - run: node --test mcp/tests/test_taiwan_style.cjs mcp/tests/test_authored_style.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify standalone Python tools
        working-directory: python-tools
        run: |
          python -B -m unittest discover -s tests -t . -p test_core_tools.py
          python -B -m unittest discover -s tests -t . -p test_entrypoints_packaging.py
          python -B -m unittest discover -s tests -t . -p test_cli_smoke.py
          python -B -m unittest discover -s tests -t . -p test_release_tools.py
      - run: git diff --check
  rust-tools:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check native scanners and report output
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/toolkit-rust-target
        shell: bash
        run: |
          failed=()
          check() { "$@" || failed+=("$*"); }
          for tool in code-health angular-checks workspace-inspection report-html token-count markdown-checks decisions visual-runtime; do
            check cargo test --locked --no-fail-fast --manifest-path tools/$tool/Cargo.toml
            check cargo clippy --locked --manifest-path tools/$tool/Cargo.toml --all-targets -- -D warnings
            check cargo fmt --manifest-path tools/$tool/Cargo.toml --check
          done
          ((${#failed[@]} == 0)) || { printf '::error::Failed: %s\n' "${failed[@]}"; exit 1; }
