name: Plugin source checks and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed full-version aggregate Tag
        required: true
        type: string
      publish:
        description: Stage verified assets in a draft Release; never publishes it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check stable aggregate Release eligibility
        shell: bash
        working-directory: .
        env:
          POLICY_TAG: ${{ inputs.tag }}
          POLICY_PRERELEASE: 'false'
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['POLICY_TAG']
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('A complete version Tag is required')
          if tag != 'v' + version or os.environ['POLICY_PRERELEASE'] == 'true':
              raise SystemExit('Release must match the stable aggregate VERSION')
          PY

  check:
    needs: eligibility
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-2022, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check canonical mappings without packaging
        run: python -B mcp/scripts/prepare_plugin_release.py --check

  publish:
    if: inputs.publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check stable aggregate Release eligibility
        shell: bash
        working-directory: .
        env:
          POLICY_TAG: ${{ inputs.tag }}
          POLICY_PRERELEASE: 'false'
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['POLICY_TAG']
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('A complete version Tag is required')
          if tag != 'v' + version or os.environ['POLICY_PRERELEASE'] == 'true':
              raise SystemExit('Release must match the stable aggregate VERSION')
          PY
      - name: Build and read back source-mapped release archives
        run: python -B mcp/scripts/prepare_plugin_release.py --output dist/plugins
      - name: Prepare verified draft Release
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAG_OBJECT=$(git rev-parse "refs/tags/$RELEASE_TAG")
          test "$(git cat-file -t "$TAG_OBJECT")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TAG_OBJECT"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state; then
            test "$(cat draft-state)" = true || { echo 'Published releases are not overwritten'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes 'Verified build assets; publish only after the complete delivery is reviewed.'
          fi
      - name: Attach verified Plugin archives
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_TAG: ${{ inputs.tag }}
        run: gh release upload "$PLUGIN_TAG" dist/plugins/*.zip dist/plugins/*.sha256 --repo "$GITHUB_REPOSITORY"
