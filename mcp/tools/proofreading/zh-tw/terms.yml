version: 1
# Scope and source IDs: docs/tools/proofreading.md, reviewed 2026-10-05
# Apply to authored prose; specification/UI copy needs explicit change authorization.
# protected-copy.cjs preserves HTML and declared literal UI/specification text.
rules:

  # Authored delivery prose; retain literal source material and identifiers
  - expected: 關卡
    patterns:
    - 关卡
    specs:
    - from: 可信关卡與處理人資料
      to: 可信關卡與處理人資料
  - expected: 來源
    patterns:
    - 来源
    specs:
    - from: 来源 ZIP
      to: 來源 ZIP
  - expected: 沒有
    patterns:
    - 没有
    specs:
    - from: 本回合没有重跑測試
      to: 本回合沒有重跑測試
  - expected: 歷史
    patterns:
    - 历史
    specs:
    - from: 历史成果
      to: 歷史成果

  # Established computing terms. Sources: mdn, android-security, dotnet, dependencies
  - expected: 軟體
    patterns:
    - 軟件
    - 软件
    specs:
    - from: 軟件
      to: 軟體
    - from: 软件
      to: 軟體
  - expected: 硬碟
    patterns:
    - 硬盤
    - 硬盘
    specs:
    - from: 硬盤
      to: 硬碟
    - from: 硬盘
      to: 硬碟
  - expected: 滑鼠
    patterns:
    - 鼠標
    - 鼠标
    specs:
    - from: 鼠標
      to: 滑鼠
    - from: 鼠标
      to: 滑鼠
  - expected: 印表機
    patterns:
    - 打印機
    - 打印机
    specs:
    - from: 打印機
      to: 印表機
    - from: 打印机
      to: 印表機
  - expected: 記憶體
    patterns:
    - 內存
    - 内存
    specs:
    - from: 內存
      to: 記憶體
    - from: 内存
      to: 記憶體
  - expected: 資料夾
    patterns:
    - 文件夾
    - 文件夹
    specs:
    - from: 文件夾
      to: 資料夾
    - from: 文件夹
      to: 資料夾
  - expected: 資料庫
    patterns:
    - 數據庫
    - 数据库
    specs:
    - from: 數據庫
      to: 資料庫
    - from: 数据库
      to: 資料庫
  - expected: 網路
    patterns:
    - 網絡
    - 网络
    specs:
    - from: 網絡
      to: 網路
    - from: 网络
      to: 網路
  - expected: 伺服器
    patterns:
    - 服務器
    - 服务器
    specs:
    - from: 服務器
      to: 伺服器
    - from: 服务器
      to: 伺服器
  - expected: 原始碼
    patterns:
    - 源代碼
    - 源代码
    - 源碼
    - 源码
    specs:
    - from: 源代碼
      to: 原始碼
    - from: 源代码
      to: 原始碼
    - from: 源碼
      to: 原始碼
    - from: 源码
      to: 原始碼
  - expected: 除錯
    patterns:
    - 調試
    - 调试
    specs:
    - from: 調試
      to: 除錯
    - from: 调试
      to: 除錯
  - expected: 非同步
    patterns:
    - 異步
    - 异步
    specs:
    - from: 異步
      to: 非同步
    - from: 异步
      to: 非同步
  - expected: 執行緒
    patterns:
    - 線程
    - 线程
    specs:
    - from: 線程
      to: 執行緒
    - from: 线程
      to: 執行緒
  - expected: 相依套件
    patterns:
    - 依賴套件
    - 依赖套件
    - 依賴包
    - 依赖包
    specs:
    - from: 依賴套件
      to: 相依套件
    - from: 依赖套件
      to: 相依套件
    - from: 依賴包
      to: 相依套件
    - from: 依赖包
      to: 相依套件
  - expected: 環境變數
    patterns:
    - 環境變量
    - 环境变量
    specs:
    - from: 環境變量
      to: 環境變數
    - from: 环境变量
      to: 環境變數
  - expected: 資料格式
    patterns:
    - 數據格式
    - 数据格式
    specs:
    - from: 數據格式
      to: 資料格式
    - from: 数据格式
      to: 資料格式
  - expected: 資料來源
    patterns:
    - 數據來源
    - 数据来源
    - 數據源
    - 数据源
    specs:
    - from: 數據來源
      to: 資料來源
    - from: 数据来源
      to: 資料來源
    - from: 數據源
      to: 資料來源
    - from: 数据源
      to: 資料來源
  - expected: 儲存空間
    patterns:
    - 存儲空間
    - 存储空间
    specs:
    - from: 存儲空間
      to: 儲存空間
    - from: 存储空间
      to: 儲存空間
  - expected: 呼叫端
    patterns:
    - 調用端
    - 调用端
    - 調用方
    - 调用方
    specs:
    - from: 調用端
      to: 呼叫端
    - from: 调用端
      to: 呼叫端
    - from: 調用方
      to: 呼叫端
    - from: 调用方
      to: 呼叫端

  # Data structures and values. Sources: mdn-array, mdn-cache, android-security, bitarray, naer-queue
  - expected: 雜湊函式
    patterns:
    - 哈希函數
    - 哈希函数
    - 散列函數
    - 雜湊函數
    specs:
    - from: 哈希函數
      to: 雜湊函式
    - from: 哈希函数
      to: 雜湊函式
    - from: 散列函數
      to: 雜湊函式
    - from: 雜湊函數
      to: 雜湊函式
  - expected: 快取
    patterns:
    - 緩存
    - 缓存
    specs:
    - from: 緩存
      to: 快取
    - from: 缓存
      to: 快取
  - expected: 緩衝區
    patterns:
    - 緩沖區
    - 缓冲区
    specs:
    - from: 緩沖區
      to: 緩衝區
    - from: 缓冲区
      to: 緩衝區
  - expected: 雜湊
    patterns:
    - 哈希
    specs:
    - from: 哈希
      to: 雜湊
  - expected: 陣列
    patterns:
    - 數組
    - 数组
    specs:
    - from: 數組
      to: 陣列
    - from: 数组
      to: 陣列
  - expected: 字串
    patterns:
    - 字符串
    specs:
    - from: 字符串
      to: 字串
  - expected: 位元組
    pattern: /(?<!文)字[節节](?![點点])/g
    specs:
    - from: 字節
      to: 位元組
    - from: 字节
      to: 位元組
    - from: 文字節點
      to: 文字節點
    - from: 文字節錄
      to: 文字節錄
  - expected: 正規表示式
    patterns:
    - 正則表達式
    - 正则表达式
    specs:
    - from: 正則表達式
      to: 正規表示式
    - from: 正则表达式
      to: 正規表示式
  - expected: 堆疊
    patterns:
    - 堆棧
    - 堆栈
    specs:
    - from: 堆棧
      to: 堆疊
    - from: 堆栈
      to: 堆疊
  - expected: 布林$1
    pattern: /(?:布爾|布尔)(值|型別|運算)/g
    specs:
    - from: 布爾值
      to: 布林值
    - from: 布爾型別
      to: 布林型別
    - from: 布爾戰爭
      to: 布爾戰爭
  - expected: 布林型別
    patterns:
    - 布爾類型
    - 布尔类型
    specs:
    - from: 布爾類型
      to: 布林型別
    - from: 布尔类型
      to: 布林型別
  - expected: 字元$1
    pattern: /字符(編碼|集|長度)/g
    specs:
    - from: 字符編碼
      to: 字元編碼
    - from: 字符集
      to: 字元集
    - from: 漢字符號
      to: 漢字符號
  - expected: 字元編碼
    patterns:
    - 字符编码
    specs:
    - from: 字符编码
      to: 字元編碼
  - expected: 字元長度
    patterns:
    - 字符长度
    specs:
    - from: 字符长度
      to: 字元長度
  - expected: 雜湊$1
    pattern: /散列(值|表|函式|函數|演算法)/g
    specs:
    - from: 散列值
      to: 雜湊值
    - from: 散列表
      to: 雜湊表
    - from: 散列分布
      to: 散列分布
  - expected: $1佇列
    pattern: /((?:事件|訊息|消息|任務|工作|請求|请求|FIFO|MQ)[ \t]*)(?:隊列|队列)/gi
    specs:
    - from: 事件隊列
      to: 事件佇列
    - from: MQ 队列
      to: MQ 佇列
    - from: 隊列行進
      to: 隊列行進
  - expected: $1序列化
    pattern: /(反?)(?:串行化)/g
    specs:
    - from: 串行化
      to: 序列化
    - from: 反串行化
      to: 反序列化
    - from: 串行傳輸
      to: 串行傳輸

  # Software meaning only. Sources: moe-default, moe-information, naer-message, mdn-callback, dotnet
  - expected: 預設$1
    pattern: /(?:默認|默认)(值|設定|選項|行為|路徑|版本|參數|語言|模式)/g
    prh: default 使用預設, 默許或承認的默認依原意保留
    specs:
    - from: 默認值
      to: 預設值
    - from: 默認模式
      to: 預設模式
    - from: 他不回答也不表示默認
      to: 他不回答也不表示默認
  - expected: 預設設定
    patterns:
    - 默認設置
    - 默认設置
    specs:
    - from: 默認設置
      to: 預設設定
    - from: 默认設置
      to: 預設設定
  - expected: 預設設定
    patterns:
    - 默認设置
    - 默认设置
    specs:
    - from: 默認设置
      to: 預設設定
    - from: 默认设置
      to: 預設設定
  - expected: 預設選項
    patterns:
    - 默認选项
    - 默认选项
    specs:
    - from: 默認选项
      to: 預設選項
    - from: 默认选项
      to: 預設選項
  - expected: 預設行為
    patterns:
    - 默認行为
    - 默认行为
    specs:
    - from: 默認行为
      to: 預設行為
    - from: 默认行为
      to: 預設行為
  - expected: 預設路徑
    patterns:
    - 默認路径
    - 默认路径
    specs:
    - from: 默認路径
      to: 預設路徑
    - from: 默认路径
      to: 預設路徑
  - expected: 預設參數
    patterns:
    - 默認参数
    - 默认参数
    specs:
