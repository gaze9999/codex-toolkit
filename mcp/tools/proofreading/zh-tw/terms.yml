  - expected: $1元件
    pattern: /((?:UI|Web|軟體|網頁|前端)(?:的)?[ \t]*)(?:組件|组件)/gi
    specs:
    - from: UI 組件
      to: UI 元件
    - from: 軟體組件
      to: 軟體元件
    - from: 機械組件
      to: 機械組件
    - from: 硬體組件
      to: 硬體組件
  - expected: $1相容
    pattern: /((?:API|SDK|軟體|套件|瀏覽器|版本|向前|向後)[ \t]*)兼容/gi
    specs:
    - from: 版本兼容
      to: 版本相容
    - from: 向後兼容
      to: 向後相容
    - from: 兼容並蓄
