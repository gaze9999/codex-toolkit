      to: 預設參數
    - from: 默认参数
      to: 預設參數
  - expected: 預設語言
    patterns:
    - 默認语言
    - 默认语言
    specs:
    - from: 默認语言
      to: 預設語言
    - from: 默认语言
      to: 預設語言
  - expected: $1預設
    pattern: /((?:工具|軟體|程式|CLI|MCP)[ \t]*)(?:默認|默认)(?!設置|设置|选项|行为|路径|参数|语言)/gi
    specs:
    - from: MCP 默認使用本機環境
      to: MCP 預設使用本機環境
    - from: 默認這項決定
      to: 默認這項決定
  - expected: $1訊息
    pattern: /((?:錯誤|警告|例外|提示|通知)(?:的)?)信息/g
    prh: message 使用訊息, information 使用資訊, 一般音訊或消息需人工判斷
    specs:
    - from: 錯誤信息
      to: 錯誤訊息
    - from: 提示的信息
      to: 提示的訊息
    - from: 久未聽聞他的信息
      to: 久未聽聞他的信息
  - expected: $1資訊
    pattern: /((?:版本|環境|帳號|個人|套件|連線)(?:的)?)信息/g
    specs:
    - from: 版本信息
      to: 版本資訊
    - from: 連線的信息
      to: 連線的資訊
    - from: 同學的信息
      to: 同學的信息
  - expected: 使用者$1
    pattern: /(?:用戶|用户)(帳號|名稱|設定|介面|權限|登入)/g
    prh: user 使用使用者, client 的用戶端及電信訂戶用語保留
    specs:
    - from: 用戶權限
      to: 使用者權限
    - from: 用戶名稱
      to: 使用者名稱
    - from: 用戶端連線
      to: 用戶端連線
