      to: 使用者名稱
    - from: 用户名
      to: 使用者名稱
    - from: 用戶名稱
      to: 用戶名稱
  - expected: 使用者帳號
    patterns:
    - 用戶賬號
    - 用户账号
    specs:
    - from: 用戶賬號
      to: 使用者帳號
    - from: 用户账号
      to: 使用者帳號
  - expected: 使用者登入
    patterns:
    - 用户登录
    specs:
    - from: 用户登录
      to: 使用者登入
  - expected: 使用者介面
    patterns:
    - 用戶界面
    - 用户界面
    specs:
    - from: 用戶界面
      to: 使用者介面
    - from: 用户界面
      to: 使用者介面
  - expected: $1使用者
    pattern: /((?:網站|軟體|應用程式|平台)(?:的)?[ \t]*)(?:用戶|用户)(?!端|名|界面|賬號|账号|登录)/g
    specs:
    - from: 網站用戶
      to: 網站使用者
    - from: 平台的用戶
      to: 平台的使用者
    - from: 網站用戶端
      to: 網站用戶端
    - from: 用戶端
