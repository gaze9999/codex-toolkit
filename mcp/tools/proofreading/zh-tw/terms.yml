  - expected: $1匯入
    pattern: /((?:資料|檔案|CSV|JSON|XLSX|Excel)[ \t]*)(?:導入|导入)/gi
    specs:
    - from: CSV 導入
      to: CSV 匯入
    - from: 導入新工具
      to: 導入新工具
  - expected: 匯入$1
    pattern: /(?:導入|导入)([ \t]*(?:CSV|JSON|XLSX|Excel|檔案|資料))/gi
    specs:
    - from: 導入CSV
      to: 匯入CSV
    - from: 導入新制度
      to: 導入新制度
  - expected: $1介面
    pattern: /((?:API|SDK|CLI|UI|Web|軟體|程式|使用者|用戶|用户)(?:的)?[ \t]*)(?:接口|界面)/gi
    specs:
