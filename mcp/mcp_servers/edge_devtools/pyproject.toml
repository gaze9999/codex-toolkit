[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "gaze9999"}]
license = {file = "LICENSE"}
name = "codex-edge-devtools-mcp"
version = "0.1.1"
description = "Isolated Microsoft Edge debugging with the pinned official DevTools MCP"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
edge-devtools-mcp = "edge_devtools_mcp.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/gaze9999/codex-toolkit"
