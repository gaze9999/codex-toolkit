[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
license = {file = "LICENSE"}
name = "codex-edge-devtools-mcp"
version = "0.1.0"
description = "Isolated Microsoft Edge debugging with the pinned official DevTools MCP"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
edge-devtools-mcp = "edge_devtools_mcp.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
