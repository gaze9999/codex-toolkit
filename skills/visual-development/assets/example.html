<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資料與空間呈現範例</title>
<style>
  body { margin: 0; padding: 24px; font: 16px system-ui; color: #d8e4ef; background: #102130; }
  main { max-width: 900px; margin: auto; }
  section { padding: 20px; margin: 20px 0; border: 1px solid #496173; border-radius: 12px; }
  canvas { width: 100%; height: 320px; display: block; }
  svg { width: 100%; height: 160px; }
  button { padding: 10px 18px; margin-right: 8px; font: inherit; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 8px; text-align: left; border-bottom: 1px solid #496173; }
  .sun { transform-origin: 450px 65px; animation: spin 20s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .sun { animation: none; } }
</style>
<main>
  <h1>資料與空間呈現範例</h1>
  <p>合成資料, 示範同一組資料的表格、2D 與 3D 呈現, 不連接天氣服務</p>
  <section>
    <h2>溫度資料與 2D 動態</h2>
    <table><thead><tr><th>時段</th><th>攝氏溫度</th></tr></thead><tbody id="rows"></tbody></table>
    <svg viewBox="0 0 540 160" role="img" aria-label="合成溫度長條圖, 數值與上方表格相同">
      <g id="bars"></g><g class="sun" aria-hidden="true"><circle cx="450" cy="65" r="26" fill="#ffce6b"/><path d="M450 22V8M450 108v14M407 65h-14M493 65h14" stroke="#ffce6b" stroke-width="6"/></g>
    </svg>
  </section>
  <section>
    <h2>3D 資料呈現</h2>
    <p id="status" role="status">尚未建立場景</p>
    <button id="mount">建立場景</button><button id="dispose">釋放場景</button>
    <canvas aria-label="合成溫度的 3D 長條圖">請使用上方溫度表格查看資料</canvas>
  </section>
</main>
<script type="module">
  import * as THREE from './vendor/three.module.js';
  import { createScene } from './three-scene.mjs';
  const data = [{ label: '上午', value: 22 }, { label: '中午', value: 28 }, { label: '晚上', value: 24 }];
  document.querySelector('#rows').innerHTML = data.map(row => `<tr><td>${row.label}</td><td>${row.value}</td></tr>`).join('');
  document.querySelector('#bars').innerHTML = data.map((row, i) => `<rect x="${20 + i * 95}" y="${140 - row.value * 4}" width="55" height="${row.value * 4}" fill="#63c7c3"/><text x="${25 + i * 95}" y="155" fill="white">${row.label}</text>`).join('');
  const status = document.querySelector('#status');
  let handle;
  let frames = 0;
  let disposedResources = 0;
  function unmount() {
    handle?.dispose();
    handle = null;
    status.textContent = '場景已釋放, 表格與 2D 資料仍可使用';
  }
  function mount() {
    unmount();
    handle = createScene(THREE, document.querySelector('canvas'), {
      onFrame(time, { scene }) { frames++; scene.rotation.y = Math.sin(time * 0.3) * 0.2; },
      onError() { status.textContent = '3D 無法顯示, 請使用上方表格與 2D 圖表'; }
    });
    if (handle.status !== 'ready') return;
    data.forEach((row, index) => {
      const geometry = handle.track(new THREE.BoxGeometry(0.6, row.value / 12, 0.6));
      const material = handle.track(new THREE.MeshNormalMaterial());
      geometry.addEventListener('dispose', () => disposedResources++);
      material.addEventListener('dispose', () => disposedResources++);
      const bar = new THREE.Mesh(geometry, material);
      bar.position.x = index - 1;
      handle.scene.add(bar);
    });
    handle.render();
    status.textContent = '3D 場景已建立';
  }
  document.querySelector('#mount').addEventListener('click', mount);
  document.querySelector('#dispose').addEventListener('click', unmount);
  window.addEventListener('pagehide', unmount, { once: true });
  window.visualExample = { mount, unmount, getState: () => ({ frames, disposedResources, active: handle?.status === 'ready', data, width: handle?.renderer.domElement.width }) };
  mount();
</script>
</html>
