[package]
name = "work-artifact-cleanup"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Preview and quarantine disposable development caches and work artifacts"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
